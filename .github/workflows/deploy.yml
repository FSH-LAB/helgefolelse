name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      release:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        required: true
        type: choice
        options: [dev, staging, production]
      release:
        description: Commit SHA or release tag (for example v2026.10.42) to deploy or roll back to
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: read # Verify image provenance.
      contents: read # Check out Terraform and smoke tests.
      packages: write # Pull the image and move its environment tag.
      id-token: write # Authenticate to GCP with Workload Identity Federation.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.promote.outputs.url }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: europe-north2
      SERVICE: helgefolelse-web
      CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      CLOUDSDK_RUN_REGION: europe-north2
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            infra
            apps/web/tests
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and verify release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          [[ "$RELEASE" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo "::error::Invalid release: $RELEASE"; exit 1; }
          image="ghcr.io/${GITHUB_REPOSITORY,,}-web"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE" --jq .sha)"
          digest="$(docker buildx imagetools inspect "$image:$sha" --format '{{ .Manifest.Digest }}')"
          # Only images built and attested by CI on main are deployable.
          gh attestation verify "oci://$image@$digest" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci-cd.yml" \
            --source-ref refs/heads/main --deny-self-hosted-runners
          printf 'sha=%s\nimage=%s@%s\n' "$sha" "$image" "$digest" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        id: auth
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: europe-north2-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Apply infrastructure
        run: |
          terraform -chdir=infra init -input=false -lockfile=readonly \
            -backend-config="bucket=$PROJECT_ID-terraform-state" \
            -backend-config="prefix=helgefolelse/$ENVIRONMENT"
          terraform -chdir=infra apply -input=false -auto-approve -lock-timeout=5m \
            -var-file="environments/$ENVIRONMENT.tfvars"

      - name: Mirror image to Artifact Registry
        id: mirror
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          command -v skopeo > /dev/null || { sudo apt-get update && sudo apt-get install --yes --no-install-recommends skopeo; }
          target="$REGION-docker.pkg.dev/$PROJECT_ID/helgefolelse/web"
          # --preserve-digests fails rather than rewriting manifests, so Cloud Run runs the attested digest.
          skopeo copy --all --preserve-digests --authfile "$HOME/.docker/config.json" \
            "docker://$IMAGE" "docker://$target:$SHA"
          echo "image=$target@${IMAGE#*@}" >> "$GITHUB_OUTPUT"

      - name: Deploy candidate without traffic
        id: candidate
        env:
          IMAGE: ${{ steps.mirror.outputs.image }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          gcloud run deploy "$SERVICE" --image "$IMAGE" --no-traffic --tag candidate \
            --update-env-vars "GIT_SHA=$SHA"
          gcloud run services describe "$SERVICE" --format=json |
            jq -er '.status.traffic[] | select(.tag == "candidate") |
              "url=\(.url)\nrevision=\(.revisionName)"' >> "$GITHUB_OUTPUT"

      - name: Smoke test candidate
        env:
          SMOKE_URL: ${{ steps.candidate.outputs.url }}
          SHA: ${{ steps.release.outputs.sha }}
        run: node --test apps/web/tests/smoke.mjs

      - name: Promote candidate
        id: promote
        env:
          REVISION: ${{ steps.candidate.outputs.revision }}
        run: |
          gcloud run services update-traffic "$SERVICE" --to-revisions "$REVISION=100"
          echo "url=$(gcloud run services describe "$SERVICE" --format='value(status.url)')" >> "$GITHUB_OUTPUT"

      - name: Tag image with environment
        env:
          IMAGE: ${{ steps.release.outputs.image }}
        run: docker buildx imagetools create --tag "${IMAGE%@*}:$ENVIRONMENT" "$IMAGE"
