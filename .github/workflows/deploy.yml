name: Deploy web

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      sha:
        required: true
        type: string
      digest:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to promote to
        required: true
        type: choice
        options: [dev, staging, production]
      release_run_id:
        description: Successful CD run ID for the release to deploy
        required: true
        type: string

permissions:
  actions: read

concurrency:
  group: deploy-web-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      digest: ${{ steps.release.outputs.digest }}
    steps:
      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          SHA: ${{ inputs.sha }}
          DIGEST: ${{ inputs.digest }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo '::error::Release run ID must be numeric'; exit 1; }
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" |
              jq -e --arg repo "$GITHUB_REPOSITORY" '
                select(.path == ".github/workflows/cd.yml" and
                       .event == "workflow_run" and .conclusion == "success" and
                       .head_branch == "main" and .head_repository.full_name == $repo)' > /dev/null
            gh run download "$RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name web-release --dir "$RUNNER_TEMP/release"
            SHA="$(jq -er '.sha | strings | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/release/web-release.json")"
            DIGEST="$(jq -er '.digest | strings | select(test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/release/web-release.json")"
            ci_run_id="$(jq -er '.ci_run_id | numbers | select(. > 0)' "$RUNNER_TEMP/release/web-release.json")"
            [[ "$(jq -er '.ci_conclusion' "$RUNNER_TEMP/release/web-release.json")" == success ]] || exit 1
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run_id" |
              jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$SHA" '
                select(.path == ".github/workflows/ci.yml" and .event == "push" and
                       .conclusion == "success" and .head_branch == "main" and .head_sha == $sha and
                       .head_repository.full_name == $repo)' > /dev/null
          fi
          printf 'sha=%s\ndigest=%s\n' "$SHA" "$DIGEST" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      id-token: write
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release
        id: release
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          DIGEST: ${{ needs.resolve.outputs.digest }}
        run: ./.github/scripts/verify-release.sh
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published image
        env:
          SOURCE: ${{ steps.release.outputs.source }}
          SHA: ${{ needs.resolve.outputs.sha }}
          DIGEST: ${{ needs.resolve.outputs.digest }}
        run: ./.github/scripts/verify-published-image.sh
      - uses: google-github-actions/auth@v3
        id: auth
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
      - uses: google-github-actions/setup-gcloud@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Mirror image to Artifact Registry
        id: artifact
        env:
          SOURCE: ${{ steps.release.outputs.source }}
          SHA: ${{ needs.resolve.outputs.sha }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          REPOSITORY: ${{ vars.GAR_REPOSITORY }}
        run: ./.github/scripts/mirror-image.sh
      - name: Deploy Cloud Run service
        env:
          IMAGE: ${{ steps.artifact.outputs.image }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
        run: ./.github/scripts/deploy-cloud-run.sh