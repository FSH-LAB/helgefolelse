name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      digest: ${{ steps.push.outputs.digest }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: web-image-${{ github.event.workflow_run.head_sha || github.sha }}
      cancel-in-progress: false
    steps:
      - name: Resolve commit SHA
        id: sha
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}
          persist-credentials: false
      - name: Build image
        id: image
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: ./.github/scripts/build-image.sh
      - name: Scan image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ steps.sha.outputs.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        id: push
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: ./.github/scripts/push-image.sh
      - name: Record release
        env:
          SHA: ${{ steps.sha.outputs.sha }}
          DIGEST: ${{ steps.push.outputs.digest }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          jq -n --arg sha "$SHA" --arg digest "$DIGEST" --arg ci_run_id "$CI_RUN_ID" \
            --arg ci_conclusion "$CI_CONCLUSION" \
            '{sha: $sha, digest: $digest, ci_run_id: ($ci_run_id | tonumber), ci_conclusion: $ci_conclusion}' \
            > "$RUNNER_TEMP/web-release.json"
          {
            echo "### Published web release (CD run $GITHUB_RUN_ID)"
            echo "- Commit: \`$SHA\`"
            echo "- Image: \`$DIGEST\`"
            echo "- CI: [run $CI_RUN_ID](https://github.com/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID) ($CI_CONCLUSION)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: ${{ runner.temp }}/web-release.json
          if-no-files-found: error
          retention-days: 90

  deploy-dev:
    needs: publish
    permissions:
      actions: read
      contents: read
      packages: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      sha: ${{ needs.publish.outputs.sha }}
      digest: ${{ needs.publish.outputs.digest }}
