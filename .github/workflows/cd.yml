name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      digest: ${{ steps.build.outputs.digest }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    concurrency:
      group: web-image-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    steps:
      - name: Resolve commit SHA
        id: sha
        run: echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.sha.outputs.sha }}
          persist-credentials: false
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-web" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.sha.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.sha.outputs.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          sbom: true
          provenance: mode=max
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}

  deploy-dev:
    needs: publish
    permissions:
      attestations: read
      contents: read
      packages: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      sha: ${{ needs.publish.outputs.sha }}
      digest: ${{ needs.publish.outputs.digest }}

  deploy-staging:
    needs: [publish, deploy-dev]
    permissions:
      attestations: read
      contents: read
      packages: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      sha: ${{ needs.publish.outputs.sha }}
      digest: ${{ needs.publish.outputs.digest }}

  deploy-production:
    needs: [publish, deploy-staging]
    permissions:
      attestations: read
      contents: read
      packages: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      sha: ${{ needs.publish.outputs.sha }}
      digest: ${{ needs.publish.outputs.digest }}
