name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    outputs:
      sha: ${{ github.event.workflow_run.head_sha }}
      digest: ${{ steps.push.outputs.digest }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: web-image-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Build image
        id: image
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: ./.github/scripts/build-image.sh
      - name: Scan image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ github.event.workflow_run.head_sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        id: push
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: ./.github/scripts/push-image.sh

  deploy-dev:
    needs: publish
    permissions:
      contents: read
      packages: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      sha: ${{ needs.publish.outputs.sha }}
      digest: ${{ needs.publish.outputs.digest }}
