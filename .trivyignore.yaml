misconfigurations:
  - id: GCP-0010
    paths:
      - infra/main.tf
      - main.tf
    expired_at: 2027-01-01
    statement: >-
      Adopted projects record auto_create_network=true. Changing this creation-time
      setting can replace a protected project. Audit/remove inherited default
      networks and firewall rules through an operator-reviewed change. New projects
      use auto_create_network=false in the provisioning example. This exception
      does not suppress any other network or IAM check.
